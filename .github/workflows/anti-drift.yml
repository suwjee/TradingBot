name: TradingBot Anti-Drift Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  anti-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test anti-drift verifier
        run: python3 -m unittest discover -s scripts/verification -p 'test_*.py' -v
      - name: Run full anti-drift verification
        run: python3 scripts/verification/anti_drift.py --mode full --format human --verbose
      - name: Validate deterministic JSON output
        shell: bash
        run: |
          python3 scripts/verification/anti_drift.py --mode full --format json > "$RUNNER_TEMP/anti-drift-1.json"
          python3 scripts/verification/anti_drift.py --mode full --format json > "$RUNNER_TEMP/anti-drift-2.json"
          cmp "$RUNNER_TEMP/anti-drift-1.json" "$RUNNER_TEMP/anti-drift-2.json"
