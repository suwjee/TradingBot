# last_modified_at: 2026-11-27T06:56:09+03:30
name: TradingBot Anti-Drift Verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  anti-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test anti-drift verifier
        run: python3 -m unittest discover -s scripts/verification -p 'test_*.py' -v
      - name: Run full anti-drift verification
        run: python3 scripts/verification/anti_drift.py --mode full --format human --verbose
      - name: Validate deterministic JSON output
        shell: bash
        run: |
          python3 scripts/verification/anti_drift.py --mode full --format json > "$RUNNER_TEMP/anti-drift-1.json"
          python3 scripts/verification/anti_drift.py --mode full --format json > "$RUNNER_TEMP/anti-drift-2.json"
          cmp "$RUNNER_TEMP/anti-drift-1.json" "$RUNNER_TEMP/anti-drift-2.json"

  release-inventory:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify release coverage and automatic file discovery
        shell: powershell
        run: |
          .\scripts\git\Test-ReleaseWorkflow.ps1 -Case RepositoryCoverage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\git\Test-ReleaseWorkflow.ps1 -Case ProductionClosure
          exit $LASTEXITCODE

  runtime-tests:
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/chart/package-lock.json
      - name: Install Engine dependencies
        run: python -m pip install orjson tzdata pytest
      - name: Test Engine and reference synchronization
        shell: pwsh
        run: |
          python -B -m pytest -q engine/tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B engine/tests/verification/verify_order_references.py
      - name: Install Chart dependencies
        working-directory: apps/chart
        run: npm ci --include=dev
      - name: Test Chart unit contracts
        working-directory: apps/chart
        run: npm test
      - name: Test Chart, Live Engine and browser integration
        working-directory: apps/chart
        run: node --test --test-concurrency=1 tests/integration/*.test.mjs
      - name: Build Chart
        working-directory: apps/chart
        run: npm run build
      - name: Test the Windows launcher
        shell: powershell
        run: .\scripts\verification\test-launcher.ps1
