# Non-Engine refactor gate: tests must pass without writing or changing engine/.
name: TradingBot Chart Refactor Verification

on:
  push:
    branches: [refactor]
  pull_request:
    paths:
      - "apps/chart/**"
      - ".github/workflows/chart-refactor.yml"

permissions:
  contents: read

jobs:
  chart:
    name: Chart tests and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out refactor sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify no engine files changed on this branch
        shell: bash
        run: |
          git fetch --no-tags origin main
          base="$(git merge-base HEAD origin/main)"
          changes="$(git diff --name-only "$base" HEAD -- engine/)"
          if [ -n "$changes" ]; then
            echo "::error::Changes inside engine/ are prohibited"
            printf '%s\n' "$changes"
            exit 1
          fi

      - name: Snapshot every Engine file before any tests
        shell: bash
        run: find engine -type f -print0 | sort -z | xargs -0 sha256sum > .refactor-engine.before.sha256

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/chart/package-lock.json

      - name: Set up read-only Engine integration runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Engine runtime dependencies outside engine/
        run: python -m pip install --disable-pip-version-check orjson tzdata

      - name: Install locked Chart dependencies
        working-directory: apps/chart
        run: npm ci --no-audit --no-fund

      - name: Run Chart unit and API regressions
        working-directory: apps/chart
        run: npm test

      - name: Browser startup and visibility lifecycle smoke
        working-directory: apps/chart
        run: node tests/e2e/chart-startup-smoke.mjs

      - name: Record non-Engine hot-path benchmark
        working-directory: apps/chart
        run: node --expose-gc tests/benchmarks/server-hot-paths.mjs

      - name: Compare Object Tree repeated filtering against transient index
        working-directory: apps/chart
        run: node --expose-gc tests/benchmarks/object-tree-index.mjs

      - name: Verify production build
        working-directory: apps/chart
        run: npm run build

      - name: Verify immutable Engine files after tests and build
        if: always()
        shell: bash
        run: |
          find engine -type f -print0 | sort -z | xargs -0 sha256sum > .refactor-engine.after.sha256
          diff -u .refactor-engine.before.sha256 .refactor-engine.after.sha256
