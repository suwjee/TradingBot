# Test-only Engine regression audit; runs exclusively on refactor.
name: V9 Engine Regression Gate (refactor only)
on:
  push:
    branches: [refactor]
    paths:
      - "engineering/refactor-v9/**"
      - ".github/workflows/v9-engine-regression.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-oracle-unit-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned immutable Golden commit in separate folder
        uses: actions/checkout@v4
        with:
          ref: 01d54ecf0149ebd15de92798be18810b6e2eb791
          path: golden-original
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil tzdata orjson
      - name: Run entire pinned Engine pytest unit suite, no trading source edits
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          cd golden-original
          export PYTHONPATH="$PWD/engine/pipeline:$PWD/engine/bridge:$PWD/engine/tests/unit"
          python -m pytest engine/tests/unit -ra --junitxml="$GITHUB_WORKSPACE/pinned-engine-unit.xml"
      - name: Export exact pinned official test suite as reusable audit fixture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-pinned-official-tests-01d54ecf
          path: |
            golden-original/engine/tests/unit
            golden-original/engine/tests/regression
            golden-original/engine/tests/verification
          if-no-files-found: error
      - name: Attach test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-pinned-engine-unit
          path: pinned-engine-unit.xml
          if-no-files-found: warn
  refactor-branch-unit-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout refactor branch without modifying engine
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test-only dependencies
        run: python -m pip install --disable-pip-version-check pytest psutil tzdata orjson
      - name: Run complete refactor Engine unit suite in read-only mode
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONHASHSEED: "0"
        shell: bash
        run: |
          export PYTHONPATH="$PWD/engine/pipeline:$PWD/engine/bridge:$PWD/engine/tests/unit"
          python -m pytest engine/tests/unit -ra --junitxml="$GITHUB_WORKSPACE/refactor-engine-unit.xml"
      - name: Attach test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-refactor-engine-unit
          path: refactor-engine-unit.xml
          if-no-files-found: warn
