name: V9 synthetic exact validation (checkpoint or full certification)
on:
  push:
    branches: [refactor]
    paths:
      - '.github/workflows/v9-synthetic-trace.yml'
      - 'versions/V9/tooling/single_pass_trace_gate.py'
      - 'versions/V9/tooling/benchmark_trace_validation.py'
      - 'versions/V9/tooling/audit_trace_coverage.py'
      - 'versions/V9/tooling/strict_trace_gate_v9.py'
      - 'versions/V9/tooling/run_verified_trace_pair_v9.py'
      - 'versions/V9/tooling/semantic_trace_v9.py'
      - 'versions/V9/tooling/verify_streamed_stage_sidecars.py'
      - 'versions/V9/tooling/strict_golden.py'
      - 'versions/V9/tooling/safe_sidecar.py'
      - 'versions/V9/tooling/generate_frozen_synthetic.py'
      - 'versions/V9/tooling/global_semantic_trace_compare_v9.py'
      - 'versions/V9/tooling/summarize_synthetic_execution.py'
      - 'versions/V9/tooling/test_single_pass_trace_gate.py'
      - 'versions/V9/reports/synthetic-frozen-scales.json'
      - 'baselines/**'
  workflow_dispatch:
    inputs:
      level:
        description: 'checkpoint (100k/250k with reference audit) or full (500k/1M certification)'
        required: true
        default: checkpoint
        type: choice
        options:
          - checkpoint
          - full
permissions:
  contents: read
jobs:
  frozen-synthetic-pair:
    if: github.ref == 'refs/heads/refactor'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        bars: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.level == 'full' && '[1000000,500000]' || '[100000,250000]') }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 01d54ecf0149ebd15de92798be18810b6e2eb791
          path: original
          sparse-checkout: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 01d54ecf0149ebd15de92798be18810b6e2eb791
          path: v81
          sparse-checkout: engine
          persist-credentials: false
      - uses: actions/checkout@v4
        if: matrix.bars <= 250000
        with:
          ref: 64326df566ac0f9be9d7396c7458b7f6471f4510
          path: reference-tools
          sparse-checkout: versions/V9/tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check psutil==7.2.2 orjson==3.11.9 tzdata==2026.2
      - name: Record actual host and interpreter
        run: |
          python -VV
          python -m pip freeze
          uname -a
          nproc
          free -h
      - name: Verify and reconstruct exact frozen sources in isolated checkouts
        shell: bash
        run: |
          python workspace/tooling/verify_baseline.py --manifest workspace/baselines/manifest.json --engine original/engine --variant original
          git -C v81 apply --check "$GITHUB_WORKSPACE/workspace/baselines/V8.1.patch"
          git -C v81 apply "$GITHUB_WORKSPACE/workspace/baselines/V8.1.patch"
          python workspace/tooling/verify_baseline.py --manifest workspace/baselines/manifest.json --engine v81/engine --variant v81
      - name: Reproduce exact historical synthetic RAW (not market data)
        env:
          BARS: ${{ matrix.bars }}
        run: |
          mkdir -p "$RUNNER_TEMP/v9-input" "$RUNNER_TEMP/v9-result"
          python workspace/versions/V9/tooling/generate_frozen_synthetic.py --bars "$BARS" --frozen workspace/versions/V9/reports/synthetic-frozen-scales.json --raw "$RUNNER_TEMP/v9-input/raw.json" --case "$RUNNER_TEMP/v9-input/case.json"
      - name: Run both sources to completion and audit all selected trace sidecars
        shell: bash
        run: |
          set +e
          python -B workspace/versions/V9/tooling/run_verified_trace_pair_v9.py --case "$RUNNER_TEMP/v9-input/case.json" --raw "$RUNNER_TEMP/v9-input/raw.json" --original-engine original/engine --v81-engine v81/engine --out "$RUNNER_TEMP/v9-result"
          rc=$?
          set -e
          python workspace/versions/V9/tooling/summarize_synthetic_execution.py --result "$RUNNER_TEMP/v9-result" --case "$RUNNER_TEMP/v9-input/case.json" --exit-code "$rc" --summary "$GITHUB_STEP_SUMMARY"
      - name: Exact full-report equivalence and same-host ABBA audit benchmark
        if: matrix.bars <= 250000
        shell: bash
        run: |
          python -B workspace/versions/V9/tooling/benchmark_trace_validation.py "$RUNNER_TEMP/v9-result/original.trace.jsonl.gz" "$RUNNER_TEMP/v9-result/v81.trace.jsonl.gz" --reference-tooling reference-tools/versions/V9/tooling --blocks 1 --out "$RUNNER_TEMP/v9-result/validator-benchmark.json"
      - name: Upload reports and exact compressed trace evidence (finite retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9-frozen-synthetic-${{ matrix.bars }}
          path: |
            ${{ runner.temp }}/v9-input/case.json
            ${{ runner.temp }}/v9-result/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
